spring.application.name=ledgerline
server.port=${PORT:8080}

spring.datasource.url=${LEDGERLINE_DB_URL:jdbc:mysql://localhost:3306/ledgerline_db?serverTimezone=UTC}
spring.datasource.username=${LEDGERLINE_DB_USERNAME}
spring.datasource.password=${LEDGERLINE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

ledgerline.security.jwt.secret-base64=${LEDGERLINE_JWT_SECRET_BASE64}
ledgerline.security.jwt.issuer=${LEDGERLINE_JWT_ISSUER:ledgerline}
ledgerline.cors.allowed-origins=${LEDGERLINE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
